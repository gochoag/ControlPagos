# Compila, firma y publica el APK al subir un tag app-v<versionCode> (ver mobile/README.md).
# La app descarga releases/latest/download/controlpagos.apk cuando el backend exige una build mayor.
name: APK
on:
  push:
    tags: ["app-v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: El tag debe coincidir con versionCode
        run: |
          code=$(grep -oP 'versionCode \K\d+' mobile/android/app/build.gradle)
          [ "app-v$code" = "$GITHUB_REF_NAME" ] || { echo "::error::El tag $GITHUB_REF_NAME no coincide con versionCode $code"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Dependencias y proyecto Android
        working-directory: mobile
        run: npm ci && npx cap sync android

      - name: Compilar APK firmado
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$ANDROID_KEYSTORE_B64" ] || { echo "::error::Falta el secret ANDROID_KEYSTORE_B64"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/controlpagos.apk"
          rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/controlpagos.apk" \
            --title "App $GITHUB_REF_NAME" --notes "APK firmado de ControlPagos." --latest
