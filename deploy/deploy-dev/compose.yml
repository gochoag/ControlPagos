# Adaptado de infra-vps-tecnomovil/plantillas/deploy-dev/compose.yml.
# Todo (misma imagen que producción): docker compose -f deploy/deploy-dev/compose.yml up --build
# Solo la base (para `python manage.py ...` desde el venv): docker compose -f deploy/deploy-dev/compose.yml up -d db
services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17                               # misma versión mayor que el Postgres compartido del VPS
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app                         # solo para tu equipo; nunca la uses en producción
    ports:
      - "127.0.0.1:5433:5432"                        # 5433 para no chocar con el PostgreSQL instalado en Windows
    volumes:
      - db-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 5s
      retries: 10

volumes:
  db-dev:
